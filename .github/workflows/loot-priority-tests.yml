name: Loot priority tests

on:
  pull_request:
    paths:
      - 'app/Services/LootPrioritySorter.php'
      - 'app/Services/ExpeditionLootGenerator.php'
      - 'app/Services/ExpeditionBalanceSimulator.php'
      - 'config/loot_priorities.php'
      - 'tests/Unit/LootPrioritySorterTest.php'
      - 'tests/Feature/ExpeditionBalanceSimulatorTest.php'
      - '.github/workflows/loot-priority-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: mkdir -p database && touch database/database.sqlite
      - run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
      - run: php artisan test tests/Unit/LootPrioritySorterTest.php tests/Feature/ExpeditionBalanceSimulatorTest.php
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
